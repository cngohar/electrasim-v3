<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1d4ed8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="wireH" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0" />
      <stop offset="40%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#ef4444;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ef4444;stop-opacity:0" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Subtle grid dots -->
  <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
    <circle cx="20" cy="20" r="1.5" fill="#3b82f6" fill-opacity="0.15"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#dots)" />

  <!-- Decorative circuit lines -->
  <g stroke="#3b82f6" stroke-width="2" stroke-opacity="0.25" fill="none">
    <polyline points="80,160 80,320 280,320 280,200 480,200"/>
    <polyline points="720,200 920,200 920,320 1120,320 1120,160"/>
    <polyline points="480,200 480,440 720,440 720,200"/>
    <circle cx="480" cy="200" r="5" fill="#3b82f6" fill-opacity="0.4"/>
    <circle cx="720" cy="200" r="5" fill="#3b82f6" fill-opacity="0.4"/>
    <circle cx="480" cy="440" r="5" fill="#3b82f6" fill-opacity="0.4"/>
    <circle cx="720" cy="440" r="5" fill="#3b82f6" fill-opacity="0.4"/>
  </g>

  <!-- Energised wire (red live wire) -->
  <g filter="url(#glow)">
    <polyline points="280,320 480,320 480,440" stroke="#ef4444" stroke-width="2.5" fill="none" stroke-opacity="0.9"/>
    <circle cx="280" cy="320" r="4" fill="#ef4444"/>
    <circle cx="480" cy="440" r="4" fill="#ef4444"/>
  </g>

  <!-- Component boxes -->
  <!-- Battery -->
  <g>
    <rect x="48" y="270" width="64" height="100" rx="8" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1.5" stroke-opacity="0.6"/>
    <text x="80" y="315" text-anchor="middle" font-size="11" fill="#93c5fd" font-family="ui-monospace,monospace">BATT</text>
    <g transform="translate(71.8 320) scale(0.5556)"><path fill="#FFAC33" d="M32.938 15.651C32.792 15.26 32.418 15 32 15H19.925L26.89 1.458c.219-.426.106-.947-.271-1.243C26.437.071 26.218 0 26 0c-.233 0-.466.082-.653.243L18 6.588 3.347 19.243c-.316.273-.43.714-.284 1.105S3.582 21 4 21h12.075L9.11 34.542c-.219.426-.106.947.271 1.243.182.144.401.215.619.215.233 0 .466-.082.653-.243L18 29.412l14.653-12.655c.317-.273.43-.714.285-1.106z"/></g>
  </g>
  <!-- Switch -->
  <g>
    <rect x="248" y="170" width="64" height="100" rx="8" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1.5" stroke-opacity="0.6"/>
    <text x="280" y="215" text-anchor="middle" font-size="11" fill="#93c5fd" font-family="ui-monospace,monospace">SW</text>
    <line x1="258" y1="240" x2="302" y2="220" stroke="#10b981" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <!-- Bulb -->
  <g>
    <rect x="448" y="170" width="64" height="100" rx="8" fill="#1e3a8a" stroke="#fbbf24" stroke-width="1.5" stroke-opacity="0.8"/>
    <circle cx="480" cy="210" r="14" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-opacity="0.8"/>
    <circle cx="480" cy="210" r="7" fill="#fbbf24" fill-opacity="0.6"/>
    <text x="480" y="250" text-anchor="middle" font-size="11" fill="#fbbf24" font-family="ui-monospace,monospace">BULB</text>
  </g>
  <!-- MCB -->
  <g>
    <rect x="688" y="170" width="64" height="100" rx="8" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1.5" stroke-opacity="0.6"/>
    <text x="720" y="215" text-anchor="middle" font-size="11" fill="#93c5fd" font-family="ui-monospace,monospace">MCB</text>
    <rect x="708" y="225" width="24" height="36" rx="4" fill="#ef4444" fill-opacity="0.7"/>
    <text x="720" y="248" text-anchor="middle" font-size="10" fill="white" font-family="Arial">B6</text>
  </g>

  <!-- Brand zone -->
  <!-- Icon -->
  <rect x="520" y="90" width="56" height="56" rx="14" fill="#2563eb" />
  <g transform="translate(535.7 115) scale(0.8333)"><path fill="#FFAC33" d="M32.938 15.651C32.792 15.26 32.418 15 32 15H19.925L26.89 1.458c.219-.426.106-.947-.271-1.243C26.437.071 26.218 0 26 0c-.233 0-.466.082-.653.243L18 6.588 3.347 19.243c-.316.273-.43.714-.284 1.105S3.582 21 4 21h12.075L9.11 34.542c-.219.426-.106.947.271 1.243.182.144.401.215.619.215.233 0 .466-.082.653-.243L18 29.412l14.653-12.655c.317-.273.43-.714.285-1.106z"/></g>

  <!-- App name -->
  <text x="590" y="120" font-size="52" font-weight="bold" fill="white" font-family="ui-sans-serif,system-ui,sans-serif" letter-spacing="-1">ElectraSim</text>

  <!-- Tagline -->
  <text x="600" y="160" text-anchor="middle" font-size="22" fill="#93c5fd" font-family="ui-sans-serif,system-ui,sans-serif">
    Interactive Wiring Lab
  </text>

  <!-- Feature pills -->
  <g font-family="ui-sans-serif,system-ui,sans-serif" font-size="14">
    <!-- Pill 1 -->
    <rect x="300" y="495" width="160" height="34" rx="17" fill="#1d4ed8" fill-opacity="0.5" stroke="#3b82f6" stroke-width="1" stroke-opacity="0.5"/>
    <text x="380" y="517" text-anchor="middle" fill="#bfdbfe">Live Simulation</text>
    <!-- Pill 2 -->
    <rect x="480" y="495" width="160" height="34" rx="17" fill="#1d4ed8" fill-opacity="0.5" stroke="#3b82f6" stroke-width="1" stroke-opacity="0.5"/>
    <text x="560" y="517" text-anchor="middle" fill="#bfdbfe">Fault Detection</text>
    <!-- Pill 3 -->
    <rect x="660" y="495" width="180" height="34" rx="17" fill="#1d4ed8" fill-opacity="0.5" stroke="#3b82f6" stroke-width="1" stroke-opacity="0.5"/>
    <text x="750" y="517" text-anchor="middle" fill="#bfdbfe">Offline PWA · Free</text>
  </g>

  <!-- Bottom caption -->
  <text x="600" y="590" text-anchor="middle" font-size="13" fill="#475569" font-family="ui-monospace,monospace">
    Build · Simulate · Reason — right in your browser
  </text>
</svg>
